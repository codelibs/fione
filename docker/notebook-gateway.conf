# Fione notebook gateway (Compose profile `notebook`, service notebook-gateway): mounted over
# /etc/nginx/conf.d/default.conf of nginxinc/nginx-unprivileged, so this is the http context.
#
#   :8080  public (published on 127.0.0.1): browsers to the per-user JupyterLab containers,
#          /user/<uid>/... to nb-<uid>:8888 on the `notebooks` network.
#   :8081  relay (not published, reached on `notebooks` only): the containers' fione-sdk calls
#          to Fione's API, the only path from a notebook to Fione.
#
# nginx picks a location by the normalized path (decoded, dot segments resolved, slashes
# merged) but sends the client's raw path upstream. A raw path with a dot segment, plain or
# percent-encoded, is refused (404) on both servers, so the upstream never sees a path whose
# meaning differs from the one the rules below checked.
#
# Request headers pass through unchanged unless set below: Jupyter's sign-in needs the
# browser's Sec-Fetch-Site (same-site from Fione's page), Referer (Fione's origin), Origin and
# Host.
# Behind HTTPS, Jupyter's `_xsrf` cookie is not marked Secure (its login cookie is); it only
# guards against cross-site posts and is not a credential.

# No query strings ($request, $request_uri, $args) and no Referer: a sign-in URL carries a
# one-time launch token.
log_format fione_gateway '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

# Docker's embedded DNS, re-asked every 10 s: notebook containers come and go.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;

# Fione's session cookie is host-only, so it reaches the notebook origin when both share a host
# name (cookies ignore the port: the local same-host setup), not from a sibling subdomain.
# Strip it before Jupyter, and user code, see it. If a second one survives the strip (a planted
# duplicate), drop every cookie.
map $http_cookie $nb_cookie_once {
    default $http_cookie;
    "~^\s*fione_session=[^;]*;?\s*(?<nb_ck_rest>.*)$" $nb_ck_rest;
    "~^(?<nb_ck_pre>.*?);\s*fione_session=[^;]*(?<nb_ck_post>.*)$" "$nb_ck_pre$nb_ck_post";
}
map $nb_cookie_once $nb_cookie {
    default $nb_cookie_once;
    "~(^|;)\s*fione_session=" "";
}

map $http_upgrade $nb_connection {
    default upgrade;
    "" close;
}

# A dot segment in the raw path: `.` or `..`, plain or %2e, after `/` or %2f.
map $request_uri $dot_segment {
    default 0;
    "~*^[^?]*(/|%2f)(\.|%2e){1,2}(/|%2f|\?|$)" 1;
}

# The relay forwards only bearer-token requests (the notebook's own scoped token).
map $http_authorization $relay_bearer {
    default 0;
    "~^Bearer\s+\S" 1;
}

server {
    listen 8080;
    access_log /dev/stdout fione_gateway;

    if ($dot_segment) {
        return 404;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $nb_cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nb_connection;
    proxy_read_timeout 1h;
    proxy_buffering off;
    client_max_body_size 100m;

    # ?launch=<token>: an upstream error is logged with the request line, so only crit here.
    location ~ "^/user/(?<uid>[0-9]{1,18})/login$" {
        error_log /dev/stderr crit;
        proxy_pass http://nb-$uid:8888;
    }

    # JupyterLab's settings and workspaces APIs skip the owner check: read-only here.
    location ~ "^/user/(?<uid>[0-9]{1,18})/lab/api/(settings|workspaces)(/|$)" {
        limit_except GET {
            deny all;
        }
        proxy_pass http://nb-$uid:8888;
    }

    location ~ "^/user/(?<uid>[0-9]{1,18})/" {
        proxy_pass http://nb-$uid:8888;
    }

    location / {
        return 404;
    }
}

server {
    listen 8081;
    access_log /dev/stdout fione_gateway;

    if ($dot_segment) {
        return 404;
    }

    # No signing in, no token minting, no user administration from a notebook.
    location ~* "^/api/v1/(auth|tokens|users)(/|$)" {
        return 403;
    }

    location /api/v1/ {
        if ($relay_bearer = 0) {
            return 401;
        }
        # A variable, so that `fione` is resolved per request (it may restart elsewhere).
        set $fione fione;
        proxy_pass http://$fione:8080;
        # 1.1: an unbuffered chunked upload is streamed as it comes (1.0 has no chunking).
        proxy_http_version 1.1;
        # Fione sees the notebook's own address, whatever the client sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Cookie "";
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
