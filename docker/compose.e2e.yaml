# The end-to-end test stack (tests/e2e, scripts/docker-smoke.sh): an override of
# compose.yaml with its own project name, host ports 18080/18081 and the test-only
# values of docker/e2e.env, which are public in this repository. Never use them for a real
# deployment.
#
#   docker compose --env-file docker/e2e.env -f docker/compose.yaml -f docker/compose.e2e.yaml \
#       up -d --build --wait
#   ... tests against http://127.0.0.1:18080 (setup token: see docker/e2e.env) ...
#   docker compose --env-file docker/e2e.env -f docker/compose.yaml -f docker/compose.e2e.yaml \
#       down -v
name: fione-e2e

services:
  fione:
    environment:
      # The tests sign in with wrong passwords on purpose.
      FIONE_LOGIN_MAX_FAILURES: "1000"
      FIONE_LOGIN_MAX_FAILURES_PER_IP: "10000"
      # Fione-kun against the fake LLM below, which downloads its model at once. These two
      # values are for the tests only: compose.yaml has both off.
      FIONE_LLM_BASE_URL: http://fake-llm:11434/v1
      FIONE_LLM_MODEL: fake-model
      FIONE_LLM_AUTO_PULL: "true"
      FIONE_MCP_ENABLED: "true"
    # The monitor's first probe must find the fake: the next one is 30 seconds later.
    depends_on:
      fake-llm:
        condition: service_healthy
    restart: "no"
    healthcheck:
      interval: 3s
      start_period: 20s

  seaweedfs:
    restart: "no"
    healthcheck:
      interval: 2s

  # A stand-in for Ollama (tests/fake_llm.py, stdlib only, read-only mount): starts without the
  # model, which Fione pulls. Not published. Raise --pull-delay to watch the progress by hand.
  fake-llm:
    image: python:3.12.15-slim-trixie
    command:
      - python
      - /fake/fake_llm.py
      - --host
      - 0.0.0.0
      - --port
      - "11434"
      - --policy
      - e2e
      - --missing
      - --pull-delay
      - "0.2"
    volumes:
      - ../tests/fake_llm.py:/fake/fake_llm.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:11434/api/version", timeout=2)
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [llm]
    restart: "no"
