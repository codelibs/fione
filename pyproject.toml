[project]
name = "fione"
dynamic = ["version"]
description = "Fione: AutoML server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.43.118",
    "catboost>=1.2.10",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "playwright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fione/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fione"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "s3: needs an S3-compatible server (set FIONE_TEST_S3_ENDPOINT, _BUCKET, _ACCESS_KEY, _SECRET_KEY)",
    "timing: wall-clock time budget checks (select with -m timing)",
]
