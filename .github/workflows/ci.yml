name: CI

on:
  pull_request:
  push:
    branches: [v2, master]

permissions:
  contents: read

# A newer push to the same pull request or branch makes the running one pointless (pull
# requests); pushes to the main branches still finish, one after the other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group notebook
      - run: uv run python scripts/check_licenses.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Unit, API, web and contract tests (acceptance, e2e, docker and notebook are deselected
      # by default).
      - run: uv run pytest -q
      # The notebook image's Jupyter extension, against a real Jupyter server.
      - run: uv run pytest -m notebook -q

  e2e:
    # Pushes to the main branches only: the browser suite against the Compose stack.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - name: Build the images (fione, serving, notebook launcher and notebook)
        run: >
          docker compose --env-file docker/e2e.env
          -f docker/compose.yaml -f docker/compose.e2e.yaml
          --profile serving --profile notebook build
      # The notebook image, the launcher and the gateway against a real Docker daemon.
      - run: uv run pytest -m docker -q
      - name: End-to-end tests
        env:
          FIONE_IMAGE_TAG: e2e # the images built above
        run: uv run pytest tests/e2e -m e2e -v
      - name: Smoke test of the Compose stack
        env:
          FIONE_IMAGE_TAG: e2e
        run: scripts/docker-smoke.sh
      - name: Keep the traces, screenshots and Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: test-results/e2e
          if-no-files-found: ignore
