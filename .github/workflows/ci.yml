name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request or branch makes the running one pointless (pull
# requests); pushes to the main branches still finish, one after the other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run python scripts/check_licenses.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      # Unit, API, web and contract tests (acceptance, e2e and docker are deselected by
      # default). Thousands of tests that train small models: a quarter of them per job
      # (see FIONE_TEST_SHARD in tests/conftest.py), spread over each runner's cores.
      - run: uv run pytest -q -n auto
        env:
          FIONE_TEST_SHARD: ${{ matrix.shard }}/4

  e2e:
    # Pushes to the main branches only: the browser suite against the Compose stack.
    if: github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - name: Build the images (fione and serving)
        run: >
          docker compose --env-file docker/e2e.env
          -f docker/compose.yaml -f docker/compose.e2e.yaml
          --profile serving build
      # The Compose stack against a real Docker daemon.
      - run: uv run pytest -m docker -q
      - name: End-to-end tests
        env:
          FIONE_IMAGE_TAG: e2e # the images built above
        run: uv run pytest tests/e2e -m e2e -v
      - name: Smoke test of the Compose stack
        env:
          FIONE_IMAGE_TAG: e2e
        run: scripts/docker-smoke.sh
      - name: Keep the traces, screenshots and Compose logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: test-results/e2e
          if-no-files-found: ignore
