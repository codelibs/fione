[project]
name = "fione-sdk"
version = "20.0.0"
description = "Python client for Fione, the AutoML server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fione_sdk"]
